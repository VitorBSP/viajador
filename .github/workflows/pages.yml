name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data and PWA
        run: python3 scripts/validar.py
      # Testes de lógica (roteiro, conversor, GuIA) sobre os dados reais. Só node:test, sem npm.
      # tests/ não entra em _site: a etapa abaixo copia só os arquivos publicáveis.
      - name: Logic tests
        run: node --test tests/*.test.mjs
      - name: Prepare site (only publishable files)
        run: |
          mkdir _site
          for f in index.html app.js styles.css sw.js manifest.webmanifest manifest.json favicon.ico CNAME; do
            [ -e "$f" ] && cp "$f" _site/
          done
          for d in data icons img assets; do
            [ -d "$d" ] && cp -r "$d" _site/
          done
          touch _site/.nojekyll
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
