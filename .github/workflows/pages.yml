name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (only publishable files)
        run: |
          mkdir _site
          for f in index.html app.js styles.css sw.js manifest.webmanifest manifest.json favicon.ico CNAME; do
            [ -e "$f" ] && cp "$f" _site/
          done
          for d in data icons img assets; do
            [ -d "$d" ] && cp -r "$d" _site/
          done
          touch _site/.nojekyll
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
