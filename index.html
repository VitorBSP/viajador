<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Viajador</title>
  <meta name="description" content="Guia de bolso para viajar pelo Uruguai e pelo Rio Grande do Sul: roteiros, lugares perto de você, frases com pronúncia, gírias, álbum, história e GuIA, mesmo sem internet.">
  <meta name="theme-color" content="#0F356B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b2a63" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Viajador">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Abertura com o Duck enquanto os dados do destino carregam; o app.js tira com transição quando a tela está pronta. -->
  <div class="abertura" id="abertura" role="status">
    <div class="duck-loading">
      <div class="duck-quadro">
        <video autoplay loop muted playsinline disablepictureinpicture poster="img/duck-loading.webp" aria-hidden="true">
          <source src="img/duck-loading.webm" type="video/webm">
          <source src="img/duck-loading.mp4" type="video/mp4">
        </video>
        <img class="duck-img" src="img/duck-loading.webp" alt="" aria-hidden="true">
      </div>
      <p>Preparando o mapa da viagem…</p>
    </div>
  </div>
  <script>
    // Sem movimento: fica só a imagem. Segurança: se o app não abrir, a abertura some sozinha em 8 s.
    (function () {
      var a = document.getElementById("abertura");
      if (!a) return;
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { var v = a.querySelector("video"); if (v) v.remove(); }
      setTimeout(function () { a.classList.add("saindo"); }, 8000);
    })();
  </script>
  <a class="pular" href="#conteudo" id="pular">Pular para o conteúdo</a>
  <header class="topo" id="topo">
    <div class="topo-linha">
      <!-- Símbolo C: sol nascendo sobre o horizonte e a estrada. Mesmo desenho de icons/icon.svg. -->
      <a href="#/" class="marca" aria-label="Viajador, início">
        <svg class="marca-simbolo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path class="marca-sol" d="M15.5 25A8.5 8.5 0 0 1 32.5 25Z"/>
          <g class="marca-raios"><path d="M24 10.5v3"/><path d="M13.2 14.4l2.1 2.1"/><path d="M34.8 14.4l-2.1 2.1"/></g>
          <g class="marca-estrada"><path d="M5.5 26.5H42.5" stroke-width="2.6"/><path d="M20.8 26.5 12.5 42"/><path d="M27.2 26.5 35.5 42"/><path d="M24 30.5v2.6M24 36.2v4"/></g>
        </svg>
        <span class="marca-texto"><span>Viajador</span><span class="marca-assina">por Duck AI</span></span>
      </a>
      <label class="busca">
        <span class="sr">Buscar frase</span>
        <svg class="ico busca-lupa" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
        <input id="busca" type="search" placeholder="Buscar: banheiro, conta, foto…" autocomplete="off">
      </label>
      <label class="pais">
        <span class="pais-bandeira" id="pais-bandeira" aria-hidden="true"></span>
        <span class="sr">País</span>
        <select id="pais"></select>
      </label>
    </div>
    <!-- Cinco pilares (docs/APP_SPEC.md). No celular a barra vai para baixo da tela, com o GuIA elevado no centro;
         no PC fica na 2ª linha do topo. As outras seções viram sub-abas dentro de cada pilar (PILARES, em app.js). -->
    <nav class="abas" id="abas" aria-label="Seções principais">
      <a href="#/guia" data-pilar="explorar"><span class="aba-icone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2.3 4.9-4.9 2.3 2.3-4.9z"/></svg></span><span class="aba-nome">Explorar</span></a>
      <a href="#/" data-pilar="falar"><span class="aba-icone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4.5h14A1.5 1.5 0 0 1 20.5 6v9a1.5 1.5 0 0 1-1.5 1.5h-7.5L7 20v-3.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/></svg></span><span class="aba-nome" id="aba-falar-nome">Falar</span></a>
      <a href="#/ia" data-pilar="ia" class="aba-ia"><span class="aba-icone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span><span class="aba-nome">Gu<span class="ia">IA</span></span></a>
      <a href="#/roteiro" data-pilar="roteiro"><span class="aba-icone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2.25"/><circle cx="18" cy="18" r="2.25"/><path d="M8.25 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.75"/></svg></span><span class="aba-nome">Roteiro</span></a>
      <a href="#/album" data-pilar="album"><span class="aba-icone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 20a2 2 0 0 0 2 2h12v-4"/><path d="M10 7.5h5v5.5h-5z"/></svg></span><span class="aba-nome">Álbum</span></a>
    </nav>
  </header>

  <main id="conteudo" class="conteudo" tabindex="-1"></main>

  <div class="mostrar" id="mostrar" hidden role="dialog" aria-modal="true" aria-label="Frase em tela cheia">
    <div class="mostrar-barra">
      <button class="mostrar-btn" id="mostrar-menos" aria-label="Diminuir letra">A−</button>
      <button class="mostrar-btn" id="mostrar-mais" aria-label="Aumentar letra">A+</button>
      <button class="mostrar-btn" id="mostrar-girar" aria-label="Girar frase" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button>
      <button class="mostrar-btn" id="mostrar-ouvir" aria-label="Ouvir frase"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="mostrar-btn mostrar-fechar" id="mostrar-fechar" aria-label="Fechar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="mostrar-texto" id="mostrar-texto">
      <p class="mostrar-es" id="mostrar-es" lang="es"></p>
      <p class="mostrar-pr" id="mostrar-pr"></p>
      <p class="mostrar-pt" id="mostrar-pt"></p>
    </div>
    <p class="mostrar-acesa" id="mostrar-acesa" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"/></svg> Tela fica acesa</p>
  </div>

  <!-- GPS do Explorar: só abre quando a permissão ainda não foi dada. -->
  <dialog class="dialogo-gps" id="dialogo-gps" aria-labelledby="dialogo-gps-titulo">
    <svg class="ico dialogo-gps-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    <h2 id="dialogo-gps-titulo">Ver o que dá pra ir a pé</h2>
    <p>Sua localização fica só neste aparelho e serve para ordenar a lista pelo que está mais perto.</p>
    <div class="dialogo-gps-botoes">
      <button type="button" class="btn" id="gps-agora-nao">Agora não</button>
      <button type="button" class="btn btn-ficha" id="gps-ativar">Ativar localização</button>
    </div>
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <!-- Ranking online. A chave publicável pode ficar aqui: as regras em supabase/ranking.sql protegem os dados. -->
  <script>window.VIAJADOR_SUPABASE = { url: "https://tmhpqmhmjxgpjudruftr.supabase.co", chave: "sb_publishable_qmWelbAPViqydfEpaUXrUA_vaeuThW1" };</script>
  <!-- Um script por país (inclua também em NUCLEO, no sw.js); o primeiro é o padrão. -->
  <script src="data/uy.js"></script>
  <script src="data/rs.js"></script>
  <script src="app.js"></script>
</body>
</html>
