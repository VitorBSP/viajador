<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Viajador · Uruguai</title>
  <meta name="description" content="Guia de bolso de espanhol para brasileiros no Uruguai: frases, pronúncia, gírias e dicas para Montevidéu e Punta del Este.">
  <meta name="theme-color" content="#0b3d91">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <a href="#/" class="marca" aria-label="Início">
        <span class="sol" aria-hidden="true"></span>
        <span>Viajador</span>
      </a>
      <span class="pais" id="pais"></span>
    </div>
    <label class="busca">
      <span class="sr">Buscar frase</span>
      <input id="busca" type="search" placeholder="Buscar: banheiro, conta, foto…" autocomplete="off">
    </label>
    <nav class="abas" id="abas">
      <a href="#/" data-aba="">Situações</a>
      <a href="#/lugares" data-aba="lugares">Lugares</a>
      <a href="#/girias" data-aba="girias">Gírias</a>
      <a href="#/ditados" data-aba="ditados">Ditados</a>
      <a href="#/dicas" data-aba="dicas">Pronúncia</a>
      <a href="#/favoritos" data-aba="favoritos">★ Salvos</a>
    </nav>
  </header>

  <main id="conteudo" class="conteudo" tabindex="-1"></main>

  <div class="mostrar" id="mostrar" hidden role="dialog" aria-modal="true" aria-label="Frase em tela cheia">
    <button class="mostrar-fechar" id="mostrar-fechar" aria-label="Fechar">×</button>
    <p class="mostrar-es" id="mostrar-es"></p>
    <p class="mostrar-pt" id="mostrar-pt"></p>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="data/uy.js"></script>
  <script src="app.js"></script>
</body>
</html>
